[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specomega"
version = "0.1.0"
description = "A verification layer that bridges specification and implementation constraints"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "cloudsoa" }]
license = { text = "MIT" }
keywords = ["specification", "governance", "verification", "ai", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]

[project.urls]
Homepage = "https://github.com/cloudsoa/specomega"
Repository = "https://github.com/cloudsoa/specomega"
Documentation = "https://github.com/cloudsoa/specomega/tree/main/docs"

[project.optional-dependencies]
develop = ["pytest>=8"]

[project.scripts]
specomega = "specomega.cli:main"

[tool.setuptools.packages.find]
where = ["."]
