[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "specomega"
version = "0.1.0"
description = "A verification layer that bridges specification and implementation constraints"
requires-python = ">=3.11"
authors = [{ name = "cloudsoa" }]

[project.scripts]
specomega = "specomega.cli:main"

[tool.setuptools.packages.find]
where = ["."]
